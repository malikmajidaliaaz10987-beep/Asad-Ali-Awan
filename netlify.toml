[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Redirect /api/chat to Netlify serverless function
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

# SPA fallback for React client router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
